plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mg4.camera'
    compileSdk 34

    defaultConfig {
        applicationId "com.mg4.camera"
        minSdk 28          // Android 9.0
        // targetSdk 29 + requestLegacyExternalStorage：
        // Android 10/11 车机保持传统外部存储视图，支持直连 /storage/<UUID> 外置硬盘写入
        targetSdk 29
        versionCode 15
        versionName "2.4"
        // 骁龙 8155 为 arm64 平台
        ndk { abiFilters 'arm64-v8a' }
    }

    lint {
        abortOnError false
    }

    signingConfigs {
        release {
            storeFile rootProject.file("mg4-release.keystore")
            storePassword "mg4camera2026"
            keyAlias "mg4cam"
            keyPassword "mg4camera2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // 开源硬件解码播放器（ExoPlayer/Media3），支持倍速与进度条拖拽
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
}
